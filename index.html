<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18° Compleanno di Raffaele - Il Gioco Abbia Inizio</title>
    
    <!-- Open Graph / WhatsApp Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://raffyiamm.github.io/invito-raffaele-18/?v=3">
    <meta property="og:title" content="Il Gioco Abbia Inizio - 18° Compleanno di Raffaele">
    <meta property="og:description" content="15 Febbraio 2027 • Ore 20:00 • Villa le Zagare, Gragnano (NA). Clicca per aprire l'invito ufficiale e confermare la presenza.">
    <meta property="og:image" content="https://raffyiamm.github.io/invito-raffaele-18/copertina-whatsapp.jpg">
    <meta property="og:image:type" content="image/jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070606;
            --gold: #d4b982;
            --gold-hover: #ebd39f;
            --crimson: #8b1e2f;
            --crimson-hover: #a82438;
            --text-light: #f3ece0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1a1112 0%, #050505 100%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .invitation-card {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85), 0 0 20px rgba(212, 185, 130, 0.2);
            border: 1px solid rgba(212, 185, 130, 0.35);
            background: #000;
        }

        .invitation-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.25s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn-rsvp {
            background: linear-gradient(135deg, var(--crimson) 0%, #5c111d 100%);
            color: var(--text-light);
            border: 1px solid var(--gold);
            box-shadow: 0 4px 15px rgba(139, 30, 47, 0.45);
        }

        .btn-rsvp:hover {
            background: linear-gradient(135deg, var(--crimson-hover) 0%, #731625 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 185, 130, 0.3);
        }

        .btn-maps {
            background: rgba(20, 18, 16, 0.9);
            color: var(--gold);
            border: 1px solid rgba(212, 185, 130, 0.5);
        }

        .btn-maps:hover {
            background: rgba(212, 185, 130, 0.12);
            border-color: var(--gold-hover);
            color: var(--gold-hover);
            transform: translateY(-2px);
        }

        .btn-calendar {
            background: transparent;
            color: rgba(243, 236, 224, 0.75);
            border: 1px solid rgba(243, 236, 224, 0.2);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 12px 16px;
        }

        .btn-calendar:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .footer-note {
            font-size: 12px;
            color: rgba(212, 185, 130, 0.6);
            text-align: center;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="invitation-card">
            <img src="invito-18.jpg" alt="Invito 18° Compleanno di Raffaele - 15 Febbraio 2027 - Villa le Zagare">
        </div>

        <div class="actions">
            <a id="whatsapp-btn" href="#" target="_blank" rel="noopener" class="btn btn-rsvp">
                ♠ Conferma Presenza (RSVP)
            </a>

            <a href="https://www.google.com/maps/search/?api=1&query=Villa+le+Zagare+Via+Visitazione+68+80054+Gragnano+NA" target="_blank" rel="noopener" class="btn btn-maps">
                ♦ Apri Posizione su Google Maps
            </a>

            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=18%C2%B0+Compleanno+di+Raffaele&dates=20270215T190000Z/20270216T000000Z&details=Dress+Code%3A+Elegante.+Ti+aspettiamo+per+festeggiare+insieme!&location=Villa+le+Zagare%2C+Via+Visitazione%2C+68+-+80054+Gragnano+(NA)" target="_blank" rel="noopener" class="btn btn-calendar">
                ♣ Aggiungi al Calendario
            </a>
        </div>

        <p class="footer-note">Dress Code: Elegante • 15 Febbraio 2027 • Ore 20:00</p>
    </div>

    <script>
        // Configura qui il numero WhatsApp per ricevere le conferme (es. 393331234567)
        // Se lasciato vuoto, apre WhatsApp permettendo all'invitato di scegliere il contatto
        const numeroWhatsApp = ""; 
        const messaggio = encodeURIComponent("Ciao Raffaele! Confermo con piacere la mia presenza al tuo 18° compleanno il 15 Febbraio 2027 a Villa le Zagare.");
        
        const whatsappLink = numeroWhatsApp 
            ? `https://wa.me/${numeroWhatsApp}?text=${messaggio}`
            : `https://wa.me/?text=${messaggio}`;
            
        document.getElementById('whatsapp-btn').href = whatsappLink;
    </script>

</body>
</html>
