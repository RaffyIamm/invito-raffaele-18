<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8ad63;--gold2:#ffe4a6;--red:#760d24;--black:#080405}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--gold2);font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.2vh,28px);padding:clamp(16px,4vh,28px);background:radial-gradient(ellipse at center,#240b11 0%,#0c0507 48%,#020202 100%);transition:opacity 1.2s ease,visibility 1.2s ease}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-title{text-align:center;text-transform:uppercase;letter-spacing:.13em;font-family:'Cinzel','Cormorant Garamond',serif;font-weight:600;font-size:clamp(22px,5.6vw,39px);color:var(--gold2);text-shadow:0 0 20px #b67a36;max-width:90vw}
.intro-sub{font:500 13px/1.7 'Cinzel',serif;letter-spacing:.24em;color:#d6b77e;text-align:center}
.roulette-frame{width:min(92vw,500px);aspect-ratio:1.9;position:relative;overflow:hidden;border:1px solid #c99a4a;border-radius:3px;box-shadow:0 0 34px #a55a2266,0 16px 48px #000;isolation:isolate}
.roulette-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.08) contrast(1.06);animation:photoMove 5s ease-in-out both}
.roulette-frame:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08040555,transparent 28%,transparent 72%,#08040555),linear-gradient(0deg,#08040588,transparent 32%,transparent 75%,#08040566);pointer-events:none}
@keyframes photoMove{0%{transform:scale(1.12);filter:brightness(.72) saturate(1.05)}100%{transform:scale(1);filter:brightness(1) saturate(1.08)}}
#enter{border:1px solid #d6aa5b;border-radius:2px;padding:15px 28px;background:linear-gradient(135deg,#3b0915,#16070a);color:#ffe2a0;text-transform:uppercase;letter-spacing:.22em;font:600 13px 'Cinzel',serif;box-shadow:0 0 24px #9b5d2c55;cursor:pointer}
#enter:active{transform:scale(.98)}
#hint{font:12px 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em;color:#b9a17b;text-align:center;max-width:280px;line-height:1.5}
#invite{width:min(100vw,560px);position:relative;opacity:0;transform:scale(.985);transition:opacity 1.5s ease,transform 1.5s ease;line-height:0}
#invite.show{opacity:1;transform:scale(1)}
#poster{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;background:transparent;border:0;cursor:pointer}
#maps{left:14%;top:76.8%;width:72%;height:8.4%}
#rsvp{left:28%;top:85.7%;width:44%;height:5.5%}
#maps:focus-visible,#rsvp:focus-visible{outline:2px solid #ffe2a0;outline-offset:2px}
#sound-toggle{position:fixed;right:12px;bottom:12px;z-index:3;border:1px solid #9c7139;border-radius:50%;width:42px;height:42px;background:#12090be8;color:#f4d18a;font:18px Arial;cursor:pointer;display:none}
#notice{position:fixed;inset:0;z-index:8;background:#000b;display:none;place-items:center;padding:24px}
#notice.show{display:grid}
.dialog{max-width:320px;width:100%;padding:25px 22px;text-align:center;background:linear-gradient(145deg,#1d080d,#070506);border:1px solid #bd8b45;box-shadow:0 0 35px #000;border-radius:4px;color:#f4d18a;line-height:1.5}
.dialog strong{display:block;font-size:24px;letter-spacing:.12em;margin-bottom:10px}
.dialog button{margin-top:16px;background:#8b1730;border:1px solid #d4a65b;color:#ffe5ad;padding:10px 22px;letter-spacing:.12em}
@media (min-width:560px){body{padding:18px 0}#invite{box-shadow:0 0 50px #000}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section id="intro" aria-label="Apertura invito">
  <div class="intro-title">Il gioco abbia inizio</div>
  <div class="intro-sub">RAFFAELE · 18 ANNI · 15.02.2027</div>
  <div class="roulette-frame" aria-label="Roulette e dadi, fotografia tratta dall’invito"><img class="roulette-photo" alt="Roulette dorata e dadi rossi" src="roulette.jpg"></div>
  <button id="enter" type="button">Entra nel gioco</button>
  <div id="hint">Tocca per avviare la roulette e aprire l’invito</div>
</section>
<main id="invite" aria-label="Invito al diciottesimo compleanno di Raffaele">
  <img id="poster" alt="Invito al 18° compleanno di Raffaele, 15 febbraio 2027, ore 20:00, Villa le Zagare, Gragnano. Dress code elegante." src="invito-18.jpg">
  <a id="maps" class="hotspot" href="https://maps.app.goo.gl/gxYPaHUkbeLQq2739" target="_blank" rel="noopener" aria-label="Apri Villa le Zagare su Google Maps" title="Apri Google Maps"></a>
  <button id="rsvp" class="hotspot" type="button" aria-label="RSVP, conferma la presenza"></button>
</main>
<button id="sound-toggle" type="button" aria-label="Attiva o disattiva il suono">♫</button>
<div id="notice" role="dialog" aria-modal="true" aria-labelledby="notice-title"><div class="dialog"><strong id="notice-title">RSVP</strong><span>Il collegamento per confermare la presenza verrà attivato quando avrai creato il sondaggio o il gruppo WhatsApp.</span><br><button id="close-notice" type="button">CHIUDI</button></div></div>
<script>
// PERSONALIZZAZIONE: inserisci qui il link WhatsApp del gruppo o del sondaggio quando sarà pronto.
const RSVP_URL = "";
let soundEnabled=true;
// Audio esterno: carica nella stessa cartella di index.html il file audio.mp3.
const rouletteAudio = new Audio("audio.mp3");
rouletteAudio.preload = "auto";
function rouletteSound(){
  if(!soundEnabled) return;
  rouletteAudio.pause();
  rouletteAudio.currentTime=0;
  const playPromise=rouletteAudio.play();
  if(playPromise && typeof playPromise.catch==='function') playPromise.catch(()=>{
    document.getElementById('hint').textContent='Tocca di nuovo per attivare l’audio';
  });
}
const intro=document.getElementById('intro'), invite=document.getElementById('invite');
document.getElementById('enter').addEventListener('click',()=>{
  rouletteSound();
  document.getElementById('enter').disabled=true;
  document.getElementById('hint').textContent='La pallina è in movimento…';
  setTimeout(()=>{intro.classList.add('hide');invite.classList.add('show');document.getElementById('sound-toggle').style.display='block';},11600);
});
document.getElementById('rsvp').addEventListener('click',()=>{
  if(RSVP_URL) window.location.href=RSVP_URL;
  else document.getElementById('notice').classList.add('show');
});
document.getElementById('close-notice').addEventListener('click',()=>document.getElementById('notice').classList.remove('show'));
document.getElementById('sound-toggle').addEventListener('click',()=>{soundEnabled=!soundEnabled;document.getElementById('sound-toggle').textContent=soundEnabled?'♫':'×';if(soundEnabled) rouletteSound();});
</script>
</body>
</html>
