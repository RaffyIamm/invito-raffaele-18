<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>18° Compleanno di Raffaele - Il Gioco Abbia Inizio</title>
    
    <!-- Open Graph / WhatsApp Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://raffyiamm.github.io/invito-raffaele-18/?v=6">
    <meta property="og:title" content="Il Gioco Abbia Inizio - 18° Compleanno di Raffaele">
    <meta property="og:description" content="15 Febbraio 2027 • Ore 20:00 • Villa le Zagare, Gragnano (NA). Tocca per entrare e aprire l'invito.">
    <meta property="og:image" content="https://raffyiamm.github.io/invito-raffaele-18/copertina-whatsapp.jpg">
    <meta property="og:image:type" content="image/jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070606;
            --gold: #d4b982;
            --gold-bright: #f2d9a2;
            --crimson: #8b1e2f;
            --text-light: #f3ece0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1f1214 0%, #050505 100%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- FASE 1: INTRO ROULETTE --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 20;
            background: radial-gradient(circle at center, #1d1012 0%, #050505 100%);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.06);
        }

        .roulette-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roulette-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--gold);
            box-shadow: 0 0 30px rgba(212, 185, 130, 0.35), inset 0 0 20px rgba(0,0,0,0.9);
            background: conic-gradient(
                #8b1e2f 0deg 15deg, #111 15deg 30deg,
                #8b1e2f 30deg 45deg, #111 45deg 60deg,
                #8b1e2f 60deg 75deg, #111 75deg 90deg,
                #0e5a2f 90deg 105deg, #111 105deg 120deg,
                #8b1e2f 120deg 135deg, #111 135deg 150deg,
                #8b1e2f 150deg 165deg, #111 165deg 180deg,
                #8b1e2f 180deg 195deg, #111 195deg 210deg,
                #8b1e2f 210deg 225deg, #111 225deg 240deg,
                #8b1e2f 240deg 255deg, #111 255deg 270deg,
                #8b1e2f 270deg 285deg, #111 285deg 300deg,
                #8b1e2f 300deg 315deg, #111 315deg 330deg,
                #8b1e2f 330deg 345deg, #111 345deg 360deg
            );
            animation: spinWheel 9s linear infinite;
            position: relative;
        }

        .roulette-outer::after {
            content: '';
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            border: 2px dashed rgba(212, 185, 130, 0.7);
            background: radial-gradient(circle, #2a1d15 0%, #0c0908 75%);
        }

        .roulette-center {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--gold-bright), #8c6d36);
            border: 2px solid #fff3d1;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: #120d08;
            font-size: 18px;
            z-index: 2;
        }

        .roulette-ball {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spinBall 3.2s linear infinite reverse;
        }

        .roulette-ball::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b8b8b8);
            box-shadow: 0 0 8px #fff;
        }

        @keyframes spinWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinBall {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .intro-subtitle {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: 1.5px;
            margin-bottom: 26px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }

        .btn-enter {
            background: linear-gradient(135deg, var(--crimson) 0%, #590f1b 100%);
            color: var(--gold-bright);
            border: 1.5px solid var(--gold);
            padding: 14px 44px;
            border-radius: 50px;
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 185, 130, 0.35);
            animation: pulseBtn 2s infinite;
            transition: transform 0.2s ease;
        }

        .btn-enter:active {
            transform: scale(0.96);
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 18px rgba(212, 185, 130, 0.3); }
            50% { box-shadow: 0 0 32px rgba(212, 185, 130, 0.65); }
        }

        /* --- FASE 2: INVITO COMPATTO PER SCHERMO SMARTPHONE --- */
        #invitation-screen {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px 14px;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
        }

        #invitation-screen.visible {
            opacity: 1;
            transform: scale(1);
        }

        .audio-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 15;
            background: rgba(15, 12, 12, 0.85);
            border: 1px solid rgba(212, 185, 130, 0.5);
            color: var(--gold);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
        }

        .card-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .card-wrapper img {
            max-height: 100%;
            max-width: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid rgba(212, 185, 130, 0.4);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.9), 0 0 16px rgba(212, 185, 130, 0.18);
        }

        .compact-actions {
            flex: 0 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1.35fr 1fr 1fr;
            gap: 7px;
        }

        .btn-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 6px;
            border-radius: 7px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            transition: transform 0.15s ease;
        }

        .btn-mini:active {
            transform: scale(0.96);
        }

        .btn-rsvp {
            background: linear-gradient(135deg, var(--crimson) 0%, #5c111d 100%);
            color: var(--text-light);
            border: 1px solid var(--gold);
            box-shadow: 0 3px 10px rgba(139, 30, 47, 0.45);
        }

        .btn-maps {
            background: rgba(22, 19, 17, 0.95);
            color: var(--gold);
            border: 1px solid rgba(212, 185, 130, 0.55);
        }

        .btn-cal {
            background: rgba(22, 19, 17, 0.95);
            color: var(--text-light);
            border: 1px solid rgba(243, 236, 224, 0.3);
        }
    </style>
</head>
<body>

    <audio id="roulette-audio" src="audio.mp3" preload="auto"></audio>

    <!-- SCHERMATA 1: ROULETTE + PULSANTE ENTRA -->
    <div id="intro-screen">
        <div class="roulette-wrapper">
            <div class="roulette-outer"></div>
            <div class="roulette-ball"></div>
            <div class="roulette-center">18</div>
        </div>
        <div class="intro-subtitle">15 Febbraio 2027</div>
        <h1 class="intro-title">18° Compleanno di Raffaele</h1>
        <button id="enter-btn" class="btn-enter">Entra</button>
    </div>

    <!-- SCHERMATA 2: INVITO + PULSANTI COMPATTI -->
    <div id="invitation-screen">
        <button id="audio-btn" class="audio-toggle" title="Riascolta / Pausa Audio">🔊</button>

        <div class="card-wrapper">
            <img src="invito-18.jpg" alt="Invito 18° Compleanno di Raffaele">
        </div>

        <div class="compact-actions">
            <a id="whatsapp-btn" href="#" target="_blank" rel="noopener" class="btn-mini btn-rsvp">
                ♠ RSVP
            </a>
            <a href="https://www.google.com/maps/search/?api=1&query=Villa+le+Zagare+Via+Visitazione+68+80054+Gragnano+NA" target="_blank" rel="noopener" class="btn-mini btn-maps">
                ♦ Mappa
            </a>
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=18%C2%B0+Compleanno+di+Raffaele&dates=20270215T190000Z/20270216T000000Z&details=Dress+Code%3A+Elegante.+Ti+aspettiamo+per+festeggiare+insieme!&location=Villa+le+Zagare%2C+Via+Visitazione%2C+68+-+80054+Gragnano+(NA)" target="_blank" rel="noopener" class="btn-mini btn-cal">
                ♣ Calendario
            </a>
        </div>
    </div>

    <script>
        const numeroWhatsApp = ""; 
        const messaggio = encodeURIComponent("Ciao Raffaele! Confermo la mia presenza al tuo 18° compleanno il 15 Febbraio 2027 a Villa le Zagare.");
        document.getElementById('whatsapp-btn').href = numeroWhatsApp 
            ? `https://wa.me/${numeroWhatsApp}?text=${messaggio}`
            : `https://wa.me/?text=${messaggio}`;

        const audio = document.getElementById('roulette-audio');
        const audioBtn = document.getElementById('audio-btn');

        document.getElementById('enter-btn').addEventListener('click', () => {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('invitation-screen').classList.add('visible');
            
            audio.currentTime = 0;
            audio.play().catch(err => console.log("Riproduzione audio:", err));
        });

        audio.addEventListener('play', () => {
            audioBtn.textContent = '🔊';
        });

        audio.addEventListener('ended', () => {
            audioBtn.textContent = '🔁';
        });

        audioBtn.addEventListener('click', () => {
            if (!audio.paused) {
                audio.pause();
                audioBtn.textContent = '🔇';
            } else {
                audio.currentTime = 0;
                audio.play();
            }
        });
    </script>
</body>
</html>
